<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEWO M.A.D. DORTMUND | Premium Stay</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #FDE100; --dark: #0a0a0a; --card: #161616; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: var(--dark); color: white; }

        .hero {
            height: 65vh;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('mad2_1.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-bottom: 10px solid var(--gold); text-align: center;
        }

        .bull-logo { font-size: 80px; color: var(--gold); margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(253,225,0,0.4)); }
        h1 { font-family: 'Montserrat', sans-serif; font-size: 3.5rem; margin: 0; color: var(--gold); }

        .container { max-width: 1200px; margin: -60px auto 50px; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 30px; }

        .card { background: var(--card); border-radius: 25px; overflow: hidden; border: 1px solid #333; transition: 0.4s; }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .card img { width: 100%; height: 300px; object-fit: cover; }

        .info { padding: 25px; border-top: 4px solid var(--gold); }
        .info h3 { color: var(--gold); margin: 0 0 10px; font-size: 1.5rem; }
        
        .wa-btn {
            display: inline-block; background: var(--gold); color: #000;
            padding: 18px 40px; border-radius: 50px; font-weight: 800;
            text-decoration: none; margin-top: 20px; transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="bull-logo"><i class="fa-solid fa-bullhorn"></i></div>
    <h1>M.A.D. DORTMUND</h1>
    <p>Premium Accommodation & Business Apartments</p>
    <a href="https://wa.me/491632211158" class="wa-btn">Rezervasyon Yap</a>
</div>

<div class="container">
    <div class="grid">
        <div class="card">
            <img src="mad1_1.jpg">
            <div class="info"><h3>Modern Salon</h3><p>Konforlu ve geniş yaşam alanı.</p></div>
        </div>
        <div class="card">
            <img src="mad2_1.jpg">
            <div class="info"><h3>Lüks Yatak Odası</h3><p>Huzurlu bir konaklama deneyimi.</p></div>
        </div>
        <div class="card">
            <img src="mad3_1.jpg">
            <div class="info"><h3>Tam Donanımlı Mutfak</h3><p>İhtiyacınız olan her şey mevcut.</p></div>
        </div>
    </div>
</div>

<footer style="text-align:center; padding:50px; color:#444;">&copy; 2026 FEWO M.A.D. DORTMUND</footer>

</body>
</html>
